<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MIDO XI Capture — small promo tile 440×280</title>
<style>
  @font-face { font-family: "Space Grotesk"; src: url("../dist/fonts/space-grotesk.woff2") format("woff2"); font-weight: 300 700; }
  @font-face { font-family: "Geist Mono"; src: url("../dist/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 440px; height: 280px; overflow: hidden; }
  body {
    background: #08090b;
    position: relative;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 44px;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 36px 36px;
  }
  .glow { position: absolute; inset: 0; background: radial-gradient(110% 90% at 50% -20%, rgba(123,97,255,0.16), transparent 62%); }
  .wm {
    position: relative;
    font-family: "Space Grotesk", sans-serif; font-weight: 700;
    font-size: 44px; letter-spacing: -0.03em; color: #f3f5f8; line-height: 1;
  }
  .wm .xi { color: #7b61ff; }
  .cap {
    position: relative;
    font-family: "Geist Mono", monospace; font-size: 13px; font-weight: 500;
    letter-spacing: 0.24em; text-transform: uppercase; color: #9d88ff;
    margin-top: 12px;
  }
  .line {
    position: relative;
    font-family: "Geist Mono", monospace; font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase; color: #565f6b;
    margin-top: 22px;
  }
  .stamp {
    position: absolute; right: 44px; bottom: 34px;
    font-family: "Space Grotesk", sans-serif; font-weight: 600;
    font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
    font-size: 30px; color: rgba(157,136,255,0.5);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="wm">MIDO<span class="xi">XI</span></div>
  <div class="cap">Capture</div>
  <div class="line">Football video notes · YouTube</div>
  <div class="stamp">34:17</div>
</body>
</html>
